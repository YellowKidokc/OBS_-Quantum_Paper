<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum Papers</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#14171c;color:#e4e7ed}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #343941;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small{color:#a5acb9}main{display:grid;grid-template-columns:250px 290px 1fr;min-height:85vh}nav,section,article{padding:24px;border-right:1px solid #343941}h2{font-size:18px}button,select,input{font:inherit;color:inherit;background:#252b35;border:1px solid #465063;border-radius:7px;padding:9px;cursor:pointer}button:hover{background:#364052}nav button,section button{display:block;width:100%;text-align:left;margin:7px 0}button.active{border-color:#99b9ff;background:#26364e}textarea{width:100%;min-height:340px;padding:18px;font:15px/1.7 ui-monospace,monospace;background:#1b2028;color:inherit;border:1px solid #465063;border-radius:9px}#actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}a{color:#a8c5ff}#status{min-height:24px;color:#b9d5bd}#links a{display:block;padding:8px 0}#search{width:100%}dialog{max-width:90%;background:#1b2028;color:inherit;border:1px solid #465063;border-radius:12px}dialog select{display:block;margin:16px 0;max-width:100%}@media(max-width:900px){main{grid-template-columns:190px 1fr}article{grid-column:1/-1}}@media(max-width:520px){main{display:block}header{padding:18px}nav,section,article{padding:16px}}
[hidden]{display:none!important}
</style>
<header><div><h1>Quantum Papers</h1><small>One original. Every place it belongs.</small></div><small>Local prototype</small></header>
<main><nav aria-label="Vaults and folders"><h2>Your vaults</h2><div id="tree"></div></nav>
<section aria-label="Papers"><h2 id="folderTitle">Choose a folder</h2><input id="search" placeholder="Search registered papers" aria-label="Search registered papers"><div id="papers"></div><button id="register">Register a Markdown file…</button></section>
<article><h2 id="title">Your papers, connected</h2><p id="origin">Select a paper to read or edit its original.</p><div id="actions" hidden><button id="save">Save original</button><button id="show">Show here too…</button><button id="move">Move original…</button><button id="link">Copy permanent link</button></div><textarea id="editor" aria-label="Paper Markdown" hidden></textarea><div id="links"></div><p id="status" role="status"></p></article></main>
<dialog id="destination"><form method="dialog"><h2 id="dialogTitle">Choose a destination</h2><select id="places" aria-label="Destination folder"></select><button value="cancel">Cancel</button> <button id="confirm" value="default">Apply</button></form></dialog>
<script type="module" src="/app.js"></script></html>
